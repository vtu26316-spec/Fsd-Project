<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details - EventHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">🎟️ EventHub</div>
        <div class="nav-links">
            <a href="index.html">← Back to Events</a>
            <a href="bookings.html">My Bookings</a>
            <div class="nav-user">
                <span id="nav-username"></span>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <main class="container">

        <!-- Loading state -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading event details...</p>
        </div>

        <!-- Event detail card — filled by JavaScript -->
        <div id="event-detail" style="display:none;">

            <div class="detail-card">
                <h1 id="event-name"></h1>
                <div class="detail-meta">
                    <span id="event-date">📅</span>
                    <span id="event-venue">📍</span>
                    <span id="event-price">💰</span>
                </div>
                <p id="event-description" class="detail-desc"></p>

                <!-- Capacity bar -->
                <div class="capacity-section">
                    <div class="capacity-label">
                        <span>Seats Available</span>
                        <span id="capacity-text"></span>
                    </div>
                    <div class="capacity-bar">
                        <div id="capacity-fill" class="capacity-fill"></div>
                    </div>
                </div>
            </div>

            <!-- BOOKING FORM -->
            <div class="booking-card">
                <h2>Book Tickets</h2>

                <div id="booking-success" class="success-msg" style="display:none;"></div>
                <div id="booking-error" class="error-msg" style="display:none;"></div>

                <form id="booking-form">
                    <div class="form-group">
                        <label for="customerName">Full Name</label>
                        <input type="text" id="customerName" placeholder="Your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="customerEmail">Email Address</label>
                        <input type="email" id="customerEmail" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="tickets">Number of Tickets</label>
                        <input type="number" id="tickets" min="1" max="10" value="1" required>
                    </div>

                    <!-- Real-time total price display -->
                    <div class="price-summary">
                        <span>Total:</span>
                        <span id="total-price" class="total-amount">R 0.00</span>
                    </div>

                    <button type="submit" class="btn-primary" id="book-btn">
                        Confirm Booking
                    </button>
                </form>
            </div>

        </div>
    </main>

    <script src="auth.js"></script>
    <script src="app.js"></script>
    <script src="event-detail.js"></script>
</body>
</html>
