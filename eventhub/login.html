<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — EventHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-box">
        <div class="auth-logo">🎟️ EventHub</div>
        <h2>Welcome Back</h2>
        <p class="auth-sub">Sign in to book your tickets</p>
        <div class="demo-creds">Demo: <code>admin / admin123</code></div>
        <div id="login-error" class="error-msg" style="display:none;"></div>
        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-primary" id="login-btn">Sign In</button>
        </form>
        <p class="auth-hint">No account? <a href="signup.html">Sign up here</a></p>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
