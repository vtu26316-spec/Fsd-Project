<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — EventHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-box">
        <div class="auth-logo">🎟️ EventHub</div>
        <h2>Create Account</h2>
        <p class="auth-sub">Join EventHub to start booking</p>
        <div id="signup-error"   class="error-msg"   style="display:none;"></div>
        <div id="signup-success" class="success-msg" style="display:none;"></div>
        <form id="signup-form">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullname" placeholder="Your full name" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="new-username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="new-password" placeholder="Min 6 characters" required minlength="6">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Repeat password" required>
            </div>
            <button type="submit" class="btn-primary">Create Account</button>
        </form>
        <p class="auth-hint">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
