# Server runs on port 8080
server.port=8080

# H2 in-memory database config
spring.datasource.url=jdbc:h2:mem:ticketingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA auto-creates tables from our Java entity classes
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# This makes sure JPA creates the tables BEFORE data.sql runs
spring.jpa.defer-datasource-initialization=true

# H2 browser console available at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Allow frontend (port 3000 or file://) to call our API
# This is CORS - Cross Origin Resource Sharing
spring.web.cors.allowed-origins=*
